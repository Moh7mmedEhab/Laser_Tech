<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients matching #6366F1 primary palette -->
    <linearGradient id="ltPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Laser precision accent gradient -->
    <linearGradient id="laserBeamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#6366F1" flood-opacity="0.2" />
    </filter>
    
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#06B6D4" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Clean rounded squircle container tailored for modern dashboard & light theme -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGradient)" stroke="#E5E7EB" stroke-width="4" />
  
  <!-- Subtle tech grid / crosshair accent lines (Laser Tech theme) -->
  <line x1="96" y1="256" x2="116" y2="256" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
  <line x1="396" y1="256" x2="416" y2="256" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="96" x2="256" y2="116" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="396" x2="256" y2="416" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />

  <!-- Monogram LT Mark -->
  <g filter="url(#softShadow)">
    <!-- Letter 'L' (solid bold geometry with beveled laser angle) -->
    <path d="M 144 140 H 208 V 316 H 324 V 372 H 144 Z" fill="url(#ltPrimaryGrad)" />

    <!-- Letter 'T' (interlocking crossbar and laser vertical bar) -->
    <!-- Horizontal Crossbar of T -->
    <path d="M 236 140 H 368 C 374.6 140 380 145.4 380 152 V 196 H 236 Z" fill="url(#ltPrimaryGrad)" />

    <!-- Vertical Stem of T with high-tech laser accent slit -->
    <path d="M 288 196 H 344 V 316 H 288 Z" fill="url(#laserBeamGrad)" />

    <!-- Sharp Laser focal beam / dot accent on the base -->
    <circle cx="356" cy="344" r="14" fill="#06B6D4" filter="url(#laserGlow)" />
  </g>
</svg>
